<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Finanzas Personales</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mnav" onclick="prevM()" aria-label="Mes anterior">&#8249;</button>
      <div onclick="openMonthPicker()" style="cursor:pointer;padding:2px 6px;border-radius:var(--r2)">
        <span class="mlbl" id="lm">-</span><span class="myr" id="ly"> -</span>
        <span style="font-size:10px;color:var(--mut);margin-left:2px">▾</span>
      </div>
      <button class="mnav" onclick="nextM()" aria-label="Mes siguiente">&#8250;</button>
    </div>
    <div class="topbar-right">
      <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importJSON(this)">
      <button class="ibtn" onclick="openOverflowMenu()" title="Más opciones" aria-label="Más opciones" style="font-size:18px">&#8942;</button>
      <button class="ibtn" onclick="openNewMonth()" title="Nuevo mes" aria-label="Crear nuevo mes">&#43;</button>
    </div>
  </div>
  <div class="pbanner" id="pbanner"></div>
  <div onclick="toggleSummary()" style="display:flex;justify-content:space-between;align-items:center;padding:6px 16px;cursor:pointer;background:var(--surf);border-bottom:1px solid var(--brd)">
    <span style="font-size:11px;color:var(--mut);font-weight:600">Resumen del mes</span>
    <span id="summary-chevron" style="font-size:12px;color:var(--mut)">▼</span>
  </div>
  <div class="summary" id="summary" style="display:none"></div>
  <div class="tabs">
    <button class="tab active" onclick="sw(0)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Q1</button>
    <button class="tab" onclick="sw(1)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Q2</button>
    <button class="tab" onclick="sw(2)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Tarjeta</button>
    <button class="tab" onclick="sw(3)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>Nómina</button>
  </div>
  <div class="scroll" id="scroll"></div>
  <button class="fab" onclick="onFab()" aria-label="Agregar nuevo gasto o movimiento">&#43;</button>
</div>
<div class="mbg" id="mbg" onclick="closeBg(event)">
  <div class="modal"><div class="mhandle"></div><div id="mc"></div></div>
</div>
<div class="toast" id="toast"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-kicker">Finanzas Personales</div>
    <div class="lock-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <div class="lock-title" id="lockTitle">Ingresa tu PIN</div>
    <div class="lock-sub" id="lockSub"></div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="lock-error" id="lockError"></div>
    <div id="lockKeypad"></div>
    <button class="lock-bio-btn" id="lockBioBtn" style="display:none" onclick="lockTryBiometric()" aria-label="Desbloquear con huella o Face ID"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c-1 3-2 5-4 7"/><path d="M8.5 4.5A6.5 6.5 0 0 1 18.5 11c0 1.5-.1 3-.5 4.5"/><path d="M5.5 8A6.5 6.5 0 0 1 12 4.5"/><path d="M4.5 11c0 3.5.5 6 2 8.5"/><path d="M15.5 17c1.2-1.5 2-4 2-6a5.5 5.5 0 0 0-2.3-4.5"/><path d="M12 11a3 3 0 0 1 3 3c0 1.5-.3 3-1 4"/></svg>Usar huella / Face ID</button>
    <input type="file" id="lock-imp-file" accept=".json" style="display:none" onchange="lockImportBackup(this)">
    <button class="lock-link" id="lockRecoveryLink" style="display:none" onclick="showRecoveryOptions()">¿Problemas para ingresar?</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
