<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Finanzas Personales</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div id="mtabs" style="flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:2px"></div>
    <div class="topbar-right">
      <input type="file" id="imp-file" accept=".json,.txt" style="display:none" onchange="importJSON(this)">
      <button class="ibtn" onclick="openOverflowMenu()" title="Más opciones" aria-label="Más opciones"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
    </div>
  </div>
  <div class="pbanner" id="pbanner"></div>
  <div id="summaryBar" onclick="toggleSummary()" style="display:flex;justify-content:space-between;align-items:center;padding:6px 16px;cursor:pointer;background:var(--surf);border-bottom:1px solid var(--brd)">
    <span style="font-size:11px;color:var(--mut);font-weight:600">Resumen del mes</span>
    <span id="summary-chevron" style="color:var(--mut);display:flex;align-items:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
  </div>
  <div class="summary" id="summary" style="display:none"></div>
  <div id="basicoBreakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div id="netoBreakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div id="gastosBreakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div id="tcBreakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div id="dispQ1Breakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div id="dispQ2Breakdown" style="display:none;padding:2px 14px 8px;background:var(--surf);border-bottom:1px solid var(--brd)"></div>
  <div class="scroll" id="scroll"></div>
  <div class="tabs">
    <button class="tab active" onclick="sw(0)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Inicio</span></button>
    <button class="tab" onclick="sw(1)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg><span>Ingresos</span></button>
    <button class="tab" onclick="sw(2)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><span>Tarjeta</span></button>
    <button class="tab" onclick="sw(3)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg><span>Nómina</span></button>
    <button class="tab" onclick="sw(4)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg><span>Créditos</span></button>
  </div>
  <button class="fab" onclick="onFab()" aria-label="Agregar nuevo gasto o movimiento">&#43;</button>
</div>
<div class="mbg" id="mbg" onclick="closeBg(event)">
  <div class="modal"><div class="mhandle"></div><div id="mc"></div></div>
</div>
<div class="wbg" id="wbg">
  <div class="window">
    <div class="wheader"><button class="wback" onclick="volverDesdeCreditoDetalle()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Créditos</button></div>
    <div class="wcontent" id="wc"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-kicker">Finanzas Personales</div>
    <div class="lock-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <div class="lock-title" id="lockTitle">Ingresa tu PIN</div>
    <div class="lock-sub" id="lockSub"></div>
    <div class="lock-dots" id="lockDots"></div>
    <div class="lock-error" id="lockError"></div>
    <div id="lockKeypad"></div>
    <input type="file" id="lock-imp-file" accept=".json,.txt" style="display:none" onchange="lockImportBackup(this)">
    <button class="lock-link" id="lockRecoveryLink" style="display:none" onclick="showRecoveryOptions()">¿Problemas para ingresar?</button>
    <!-- Texto de respaldo: debe coincidir con CACHE_VERSION en sw.js. app.js lo actualiza
         en cuanto el service worker responde el postMessage GET_VERSION; esto es solo lo
         que se ve mientras esa respuesta no ha llegado (o si falla). -->
    <div class="lock-version" id="lockVersion">V 2.13 &bull; Powered by Felipe Ocampo</div>
  </div>
</div>

<!-- app.js se dividió en varios archivos por dominio bajo js/ — deben cargarse en este mismo
     orden relativo (idéntico al de js/manifest.json, usado por test/sandbox.mjs), porque código
     de nivel superior de un archivo puede depender de que uno anterior ya haya corrido. Si
     cambias este orden, actualiza también js/manifest.json y los <script> de tests.html. -->
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/creditos.js"></script>
<script src="js/format-utils.js"></script>
<script src="js/nomina-calc.js"></script>
<script src="js/render.js"></script>
<script src="js/nomina.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/gasto-pickers.js"></script>
<script src="js/tarjeta.js"></script>
<script src="js/nomina-deducciones.js"></script>
<script src="js/catalogos.js"></script>
<script src="js/gasto-estado.js"></script>
<script src="js/export-main.js"></script>

<!-- Sincronización en la nube (prueba inicial, ver js/sync.js): SDK de Firebase vía CDN,
     cargado DESPUÉS de nuestro propio código porque sync.js solo usa `firebase` dentro de
     funciones (nunca en código de nivel superior salvo el initializeApp ya protegido con un
     `typeof firebase!=='undefined'`), así que el orden respecto a los demás scripts no importa. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/sync.js"></script>

</body>
</html>
